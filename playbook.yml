
---
- name: Automatizar configuracion de servidores Ubuntu
  hosts: ubuntu_servers
  become: yes

  tasks:

    - name: Actualizar cache de APT
      apt:
        update_cache: yes

    - name: Crear usuario itla
      user:
        name: itla
        state: present
        create_home: yes

    - name: Crear carpeta app
      file:
        path: /app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: Crear archivo hola.txt
      copy:
        dest: /app/hola.txt
        content: "Hola mundo desde Ansible e ITLA"
        owner: itla
        group: itla
        mode: '0644'

    - name: Instalar cowsay y htop
      apt:
        name:
          - cowsay
          - htop
        state: present

